name = "frondose-feedback"
main = "worker/report-worker.js"
compatibility_date = "2026-11-22"
workers_dev = false
preview_urls = false
routes = [{ pattern = "forms.frondose.com", custom_domain = true }]

[vars]
FEEDBACK_ENABLED = "false"

[[ratelimits]]
name = "FEEDBACK_PER_IP"
namespace_id = "25101"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "FEEDBACK_GLOBAL"
namespace_id = "25102"
simple = { limit = 20, period = 60 }
