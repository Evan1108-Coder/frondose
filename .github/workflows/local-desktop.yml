name: Local desktop compatibility
on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  local-desktop:
    name: Local desktop on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # No model-provider or service credentials are supplied to these jobs.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build local application and packaging contract
        run: npm run build
      - name: Isolated application and runtime tests
        run: npm test
      - name: Verify Sites packaging compatibility
        run: npm run test:sites
      - name: Build unpacked desktop for this operating system
        run: npm run desktop:pack
      - name: Native packaged browser lifecycle smoke
        if: runner.os != 'Linux'
        run: node scripts/desktop-smoke.mjs --packaged
      - name: Native packaged browser lifecycle smoke with virtual display
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/desktop-smoke.mjs --packaged
      - name: Build native installers on their target operating system
        run: npm run desktop:dist
