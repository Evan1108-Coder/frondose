name: Windows runtime regression QA
on:
  push:
    branches: [qa/windows-runtime-fixtures]
permissions:
  contents: read
jobs:
  runtime-fixtures:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - run: npm ci
      - name: Repeat both Windows regressions
        shell: pwsh
        run: |
          for ($i = 1; $i -le 3; $i++) {
            node --test --test-timeout=90000 tests/local-session-history-api.test.mjs tests/local-trust-boundary.test.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
