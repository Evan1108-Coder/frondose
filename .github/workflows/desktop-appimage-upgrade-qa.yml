name: AppImage update and reopen QA
on:
  push:
    branches: [testing-public-release]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  updater-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - run: node --test tests/desktop-updates.test.mjs tests/desktop-public-release.test.mjs
  qa-images:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      FRONDOSE_RELEASE_BUILD: '1'
      FRONDOSE_RELEASE_FEED_URL: https://updates.frondose.test:18443/
      FRONDOSE_RELEASE_DOWNLOADS_URL: https://updates.frondose.test:18443/
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - name: Select the Linux native package for this disposable checkout
        run: |
          node --input-type=module -e 'import {writeFileSync} from "node:fs"; writeFileSync("config/desktop-target.json", JSON.stringify({platform:"linux",branch:"master-linux"}))'
      - run: npm ci
      - run: npm run build
      - name: Build both AppImages and sign their reviewed manifests with an ephemeral QA key
        run: |
          qa_key="$(node -p "require('node:crypto').generateKeyPairSync('ed25519').privateKey.export({format:'der',type:'pkcs8'}).toString('base64')")"
          FRONDOSE_RELEASE_LINUX_PUBLIC_KEY="$(printf '%s' "$qa_key" | node -p "require('node:crypto').createPublicKey(require('node:crypto').createPrivateKey({key:Buffer.from(require('node:fs').readFileSync(0,'utf8'),'base64'),format:'der',type:'pkcs8'})).export({format:'der',type:'spki'}).toString('base64')")"
          export FRONDOSE_RELEASE_LINUX_PUBLIC_KEY
          for age in old new; do
            if [[ "$age" == old ]]; then version=0.90.1; else version=0.90.2; fi
            output="dist-desktop-qa-$age"
            FRONDOSE_DESKTOP_BUILD_VERSION="$version" FRONDOSE_DESKTOP_OUTPUT_DIR="$output" npm run desktop:dist
            directory="release-qa-$age"
            mkdir "$directory"
            cp "$output"/Frondose*.AppImage "$output"/frondose*.deb "$output"/latest-linux.yml "$directory/"
            FRONDOSE_RELEASE_LINUX_SIGNING_KEY="$qa_key" \
              node scripts/publish-desktop-release.mjs sign-linux-qa "$directory" "$version"
          done
          unset qa_key
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qa-image-old
          path: |
            release-qa-old/*.AppImage
            release-qa-old/latest-linux.yml
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qa-image-new
          path: |
            release-qa-new/*.AppImage
            release-qa-new/latest-linux.yml
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
  upgrade:
    needs: qa-images
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: qa-images
          pattern: qa-image-*
          digest-mismatch: error
      - name: Trust a temporary TLS root for the disposable test feed
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libfuse2 libnss3-tools xdotool lsof
          test -c /dev/fuse
          umask 077
          cd "$RUNNER_TEMP"
          openssl req -x509 -nodes -newkey rsa:2048 -sha256 -days 1 -keyout frondose-qa-ca.key -out frondose-qa-ca.pem -subj '/CN=Frondose disposable update QA CA' -addext 'basicConstraints=critical,CA:TRUE' -addext 'keyUsage=critical,keyCertSign,cRLSign'
          openssl req -new -nodes -newkey rsa:2048 -keyout frondose-qa-server.key -out frondose-qa-server.csr -subj '/CN=updates.frondose.test'
          printf '%s\n' 'subjectAltName=DNS:updates.frondose.test' 'keyUsage=critical,digitalSignature,keyEncipherment' 'extendedKeyUsage=serverAuth' > frondose-qa-server.ext
          openssl x509 -req -in frondose-qa-server.csr -CA frondose-qa-ca.pem -CAkey frondose-qa-ca.key -CAcreateserial -out frondose-qa-server.pem -days 1 -sha256 -extfile frondose-qa-server.ext
          printf '127.0.0.1 updates.frondose.test\n' | sudo tee -a /etc/hosts
          sudo install -m 644 frondose-qa-ca.pem /usr/local/share/ca-certificates/frondose-qa-ca.crt
          sudo update-ca-certificates
          mkdir -p "$HOME/.pki/nssdb"
          if [[ ! -f "$HOME/.pki/nssdb/cert9.db" ]]; then certutil -N --empty-password -d "sql:$HOME/.pki/nssdb"; fi
          certutil -A -d "sql:$HOME/.pki/nssdb" -n 'Frondose disposable QA CA' -t 'C,,' -i frondose-qa-ca.pem
      - name: Click update, verify the relaunched app and saved project
        run: |
          xvfb-run -a node scripts/desktop-appimage-upgrade-qa.mjs \
            qa-images/qa-image-old qa-images/qa-image-new "$RUNNER_TEMP/frondose-qa-server.pem" "$RUNNER_TEMP/frondose-qa-server.key"
